<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Shidow TOURS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='files/css/bootstrap.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .admin-login-body {
      background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header .gold-text {
      color: #d4af37;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .login-header .admin-subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .login-header .lock-icon {
      font-size: 3rem;
      color: #d4af37;
      margin-bottom: 16px;
      display: block;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
    }

    .login-form .form-control {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      width: 100%;
      font-size: 1rem;
    }

    .login-form .form-control:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
      outline: none;
    }

    .login-form .form-control::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .login-form .btn-block {
      width: 100%;
      padding: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #d4af37, #b8962e);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .login-form .btn-block:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      background: linear-gradient(135deg, #b8962e, #a07d25);
    }

    .login-form .btn-block:active {
      transform: scale(0.98);
    }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .alert-warning {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fcd34d;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.8rem;
    }

    .login-footer a {
      color: #d4af37;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 24px;
      }
      .login-header .gold-text {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body class="admin-login-body">
  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-header">
        <span class="lock-icon"><i class="fas fa-lock"></i></span>
        <h1 class="gold-text">SHIDOW TOURS</h1>
        <p class="admin-subtitle">Administrative Access</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" class="login-form">
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-key"></i> Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required />
        </div>
        <button type="submit" class="btn-block">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div class="login-footer">
        <p>Secure Admin Panel &bull; Shidow Tours &amp; Adventures</p>
      </div>
    </div>
  </div>
</body>
</html>
